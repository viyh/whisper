version: '3'

services:
  whisper:
    image: viyh/whisper:0.5.1
    container_name: whisper
    restart: always
    environment:
      LOG_LEVEL: INFO
    volumes:
      - /home/whisper/conf/config.yaml:/usr/src/app/config.yaml:ro
      # owned by whisper's user (uid 65534), mode 700:
      #   sudo install -d -o 65534 -g 65534 -m 700 /home/whisper/data
      - /home/whisper/data:/tmp/whisper
    networks:
      - whisper
    logging:
      driver: "json-file"
      options:
        max-file: "5"
        max-size: "10m"

networks:
  whisper:
    name: whisper