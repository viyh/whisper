###
### Options
###

# Maximum upload size in KB
max_data_size_kb: 100

# Server secret key. It keys the HMAC the server stores for each secret's auth
# token, which it checks before releasing the encrypted data.
# IMPORTANT: Change this to a unique random string of 32+ characters!
# Whisper won't start while it is still this placeholder.
secret_key: 'CHANGE_ME_TO_A_RANDOM_STRING_OF_32_OR_MORE_CHARACTERS'

# Interval in seconds that the secret storage cleaner will run
storage_clean_interval: 900

# Listen IP and port for the development server (python app.py) only. In the
# container, gunicorn listens on 0.0.0.0 and the WEB_PORT environment variable
# (see README).
app_listen_ip: 0.0.0.0
app_port: 5000

# Base URL path for app, defaults to root. A missing leading or trailing
# slash is added ("whisper" = "/whisper/").
app_url_base: /

# Number of X-Forwarded-For entries added by proxies in front of this
# container (load balancers, CDNs). Used to find the real client IP for rate
# limiting and logs. 0 = clients connect directly. See README "Running Behind
# a Proxy".
trusted_proxy_count: 0

# Wrong passwords allowed per secret before it is locked until it expires.
# A locked secret's encrypted data is deleted, so raising this later doesn't
# reopen it.
# 0 turns the lock off (the per-IP limit of 10 attempts a minute still applies).
max_failed_attempts: 10

# Secrets each IP address can create per minute. 0 turns the limit off.
create_rate_limit: 30

# Argon2id cost of deriving the keys from the password. This runs in the
# browser; the server only passes these values to the page. Higher = slower to
# create and open secrets, and slower to guess passwords. Changing them makes
# unexpired secrets unopenable.
# OWASP minimum: time=3, memory=65536 (64MB), parallelism=1
argon2_time_cost: 5
argon2_memory_cost: 131072
argon2_parallelism: 1

###
### Storage Backend
###

# Choose one of the following stores:

# Local Disk store
# Writes secrets to given path within the container, so for persistence between
# containers, make sure to mount an external volumn to the path.
#
storage_class: whisper.storage.local.local
storage_config:
    path: /tmp/whisper

# In-Memory store
# Stores secrets in memory only, does not persist secrets between application runs.
#
# storage_class: whisper.storage.memory.memory
# storage_config: {}

# AWS S3 store
# Stores secrets in a given bucket/path and uses object tags for expiration.
# Credentials are set from the environment, so either mount the credential files
# to /.aws within the container or set the normal AWS environment variables.
#
# storage_class: whisper.storage.aws.s3
# storage_config:
#     bucket_name: my-secret-bucket
#     bucket_path: secrets

# GCP GCS store
# Stores secrets in a given bucket/path and uses object tags for expiration.
# Credentials are set from the environment, so either mount the credential files
# to /.config within the container or set the normal GCP environment variables.
#
# storage_class: whisper.storage.gcp.gcs
# storage_config:
#     gcp_project: my-project-name
#     bucket_name: my-secret-bucket
#     bucket_path: secrets
