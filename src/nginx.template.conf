worker_processes 1;

pid /tmp/nginx.pid;
error_log /tmp/nginx.error.log;
daemon on;

events {
  worker_connections 1024;
  accept_mutex off;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /tmp/nginx.access.log combined;
  sendfile on;
  server_names_hash_bucket_size 128;

  upstream app_server {
    server unix:/tmp/gunicorn.sock fail_timeout=0;
  }

  server {
    listen $WEB_PORT default_server;
    client_max_body_size 512k;
    server_name whisper;
    keepalive_timeout 5;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP notes:
    #   - script-src: 'wasm-unsafe-eval' is required by argon2-browser (WASM).
    #     All third-party scripts are served from jsdelivr with SRI.
    #   - style-src: 'unsafe-inline' is required by Bootstrap 5's Tooltip
    #     component, which writes inline positioning styles at runtime via
    #     Popper. If tooltips are ever removed, drop 'unsafe-inline'.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' https://cdn.jsdelivr.net; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    # HSTS: enabled by default. Whisper's threat model assumes HTTPS
    # termination in front of this container. If you are running purely over
    # HTTP for local development, comment this line out.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    access_log /tmp/nginx_host.access.log;
    client_body_temp_path /tmp/client_body 1 2;
    fastcgi_temp_path /tmp/fastcgi_temp;
    proxy_temp_path /tmp/proxy_temp;
    scgi_temp_path /tmp/scgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;

    root /usr/src/app/static;

    location /elb-status {
      access_log off;
      return 200 'OK';
      add_header Content-Type text/plain;
    }

    location / {
      try_files $uri @proxy_to_app;
    }

    location @proxy_to_app {
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_redirect off;
      proxy_pass http://app_server;
    }

    error_page 500 502 503 504 /500.html;
    location = /500.html {
      root /usr/src/app/static;
    }
  }
}
