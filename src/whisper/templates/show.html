<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Whisper</title>
        <link rel="icon" type="image/png" sizes="96x96" href="assets/favicon-96x96.png">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link rel="stylesheet" href="assets/style.css">
    </head>
    <body>
        <div class="container col-md-5">
            <div class="page-header">
                <ul class="text-center list-inline">
                    <li class="list-inline-item"><img src="assets/logo.png"/></li>
                    <li class="list-inline-item"><h2 class="vcenter align-center">Whisper</h2></li>
                </ul>
            </div>
            <hr>
            <form>
                <input type="hidden" id="secret_version" value="{{secret_version}}">
                <div id="app-config" data-argon2-time="{{argon2_time_cost}}" data-argon2-mem="{{argon2_memory_cost}}" data-argon2-par="{{argon2_parallelism}}" style="display:none;"></div>
                <div class="mb-3">
                    <label class="form-label" for="password">Secret Password</label>
                    <div class="input-group">
                        <input class="form-control" autocomplete="off" type="password" id="password" required>
                        <button type="button" class="btn btn-light inputbtn" id="togglepw" title="Show/hide password">
                            <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-eye" viewBox="0 0 16 16">
                                <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8M1.173 8a13 13 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5s3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5s-3.879-1.168-5.168-2.457A13 13 0 0 1 1.172 8z"/>
                                <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5M4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0"/>
                            </svg>
                            <svg id="eye-slash-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-eye-slash" viewBox="0 0 16 16" style="display:none;">
                                <path d="M13.359 11.238C15.06 9.72 16 8 16 8s-3-5.5-8-5.5a7 7 0 0 0-2.79.588l.77.771A6 6 0 0 1 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13 13 0 0 1 14.828 8q-.086.13-.195.288c-.335.48-.83 1.12-1.465 1.755q-.247.248-.517.486z"/>
                                <path d="M11.297 9.176a3.5 3.5 0 0 0-4.474-4.474l.823.823a2.5 2.5 0 0 1 2.829 2.829zm-2.943 1.299.822.822a3.5 3.5 0 0 1-4.474-4.474l.823.823a2.5 2.5 0 0 0 2.829 2.829"/>
                                <path d="M3.35 5.47q-.27.24-.518.487A13 13 0 0 0 1.172 8l.195.288c.335.48.83 1.12 1.465 1.755C4.121 11.332 5.881 12.5 8 12.5c.716 0 1.39-.133 2.02-.36l.77.772A7 7 0 0 1 8 13.5C3 13.5 0 8 0 8s.939-1.721 2.641-3.238l.708.709zm10.296 8.884-12-12 .708-.708 12 12z"/>
                            </svg>
                        </button>
                    </div>
                    <div class="form-text" id="password_help">Enter the password to retrieve your secret</div>
                </div>
                <div class="d-grid gap-2">
                    <button class="btn btn-primary" type="submit">Retrieve Secret</button>
                </div>
                <hr>
                <div class="output-group">
                    <textarea class="form-control" rows="5" id="decrypted_text" placeholder="" readonly></textarea>
                    <div class="output-group-button">
                        <button type="button" class="btn btn-light inputbtn clipbtn" id="copybutton" data-clipboard-target="#decrypted_text" data-bs-toggle="tooltip" data-bs-placement="bottom" title="Copied!">
                            <img class="btnimg clippy" id="copyicon" src="assets/clippy.svg" alt="Copy to clipboard">
                        </button>
                    </div>
                </div>
            </form>
        </div>

        <nav class="navbar fixed-bottom navbar-light bg-light text-right github-link">
            <div class="row-fluid text-left">
                &nbsp;&nbsp;&nbsp;v{{version}}
            </div>
            <div class="row-fluid text-right">
                <a href="https://github.com/viyh/whisper">Whisper on Github &#10142;</a>&nbsp;&nbsp;
            </div>
        </nav>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/argon2-browser@1.18.0/dist/argon2-bundled.min.js" integrity="sha384-XOR3aNvHciLPIf6r+2glkrmbBbLmIJ1EChMXjw8eBKBf8gE0rDq1TyUNuRdorOqi" crossorigin="anonymous"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js" integrity="sha384-S3wQ/l0OsbJoFeJC81UIr3JOlx/OzNJpRt1bV+yhpWQxPAahfpQtpxBSfn+Isslc" crossorigin="anonymous"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/clipboard.js/2.0.11/clipboard.min.js" integrity="sha384-J08i8An/QeARD9ExYpvphB8BsyOj3Gh2TSh1aLINKO3L0cMSH2dN3E22zFoXEi0Q" crossorigin="anonymous"></script>
        <script type="text/javascript" src="assets/whisper.js"></script>
        <script type="text/javascript" src="assets/init-show.js"></script>
    </body>
</html>
