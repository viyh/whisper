name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -r src/requirements-dev.txt
      - run: ruff check src/
      - run: bandit -r src/ -x src/tests -s B104

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -r src/requirements.txt -r src/requirements-dev.txt
      - run: pytest src/tests/ --cov=src/whisper --cov-report=term-missing

  docker:
    runs-on: ubuntu-latest
    # The base images come from Docker Hardened Images (dhi.io), which need a
    # Docker login. Set the DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (read-only
    # access token) repository secrets. Fork PRs don't get secrets, so the
    # build is skipped there.
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - if: env.DOCKERHUB_TOKEN == ''
        run: echo "::notice::DOCKERHUB_USERNAME/DOCKERHUB_TOKEN not set, skipping image build"
      - if: env.DOCKERHUB_TOKEN != ''
        run: echo "$DOCKERHUB_TOKEN" | docker login dhi.io -u "$DOCKERHUB_USERNAME" --password-stdin
      - if: env.DOCKERHUB_TOKEN != ''
        run: docker build .

  deps-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install -r src/requirements-dev.txt
      - run: pip-audit -r src/requirements.txt
